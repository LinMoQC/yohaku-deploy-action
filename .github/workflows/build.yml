name: Build and Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'deploy.yml'
      - 'build_hash'
  repository_dispatch:
    types: [trigger-workflow]

permissions: write-all
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  HASH_FILE: build_hash
  SOURCE_REPO: innei-dev/Yohaku
  SOURCE_REF: bf2c8667
  BUILD_COMMAND: pnpm --filter @yohaku/web build:ci
  STANDALONE_SUBPATH: standalone/apps/web

jobs:
  check:
    name: Check Should Build
    runs-on: ubuntu-latest
    if: ${{ github.event.head_commit.message != 'Update hash file' }}
    outputs:
      canceled: ${{ steps.compare.outputs.canceled }}
      sha_short: ${{ steps.compare.outputs.sha_short }}
    steps:
      - uses: actions/checkout@v4
      - name: Read current hash
        id: read
        run: |
          echo "file_hash=$(cat ${{ env.HASH_FILE }} 2>/dev/null || echo '')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0
          lfs: true
      - name: Compare
        id: compare
        env:
          FILE_HASH: ${{ steps.read.outputs.file_hash }}
        run: |
          current=$(git rev-parse --short HEAD)
          if [ "$FILE_HASH" == "$current" ]; then
            echo "canceled=true" >> $GITHUB_OUTPUT
          fi
          echo "sha_short=$current" >> $GITHUB_OUTPUT

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: check
    if: ${{ needs.check.outputs.canceled != 'true' }}
    strategy:
      matrix:
        node-version: [lts/*]
    outputs:
      sha_short: ${{ needs.check.outputs.sha_short }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0
          lfs: true
      - run: git lfs checkout
      - uses: pnpm/action-setup@v2
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - uses: jongwooo/next-cache@v1
      - run: pnpm install
      - name: Build
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_GATEWAY_URL: ${{ secrets.NEXT_PUBLIC_GATEWAY_URL }}
        run: |
          ${{ env.BUILD_COMMAND }}
          cd apps/web/.next
          rm -rf cache
          cp -r ../public ./standalone/public
          mv ./static ./standalone/apps/web/.next/static
          cd ./standalone
          echo ';process.title = "Yohaku (NextJS)"' >> server.js
          cd "$GITHUB_WORKSPACE"
          rm -f release.zip
          (cd apps/web/.next && zip --symlinks -r "$GITHUB_WORKSPACE/release.zip" ./* -x "dev/*" -x "cache/*")
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          # Get ecosystem.config.js from deploy repo
          curl -sL https://raw.githubusercontent.com/${{ github.repository }}/main/ecosystem.config.js -o ecosystem.config.js
          gh release delete deploy-latest -y --repo ${{ github.repository }} 2>/dev/null || true
          gh release create deploy-latest release.zip ecosystem.config.js \
            --repo ${{ github.repository }} --title "Latest Deploy" --notes "Build from ${{ needs.check.outputs.sha_short }}" --latest
      - name: Store hash
        run: echo ${{ needs.check.outputs.sha_short }} > ${{ env.HASH_FILE }}
      - name: Commit hash
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add ${{ env.HASH_FILE }}
          git diff --staged --quiet || git commit -m "Update hash file"
      - uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}

  trigger-deploy:
    name: Trigger Deploy
    runs-on: ubuntu-latest
    needs: build
    if: ${{ needs.check.outputs.canceled != 'true' }}
    steps:
      - name: Dispatch deploy workflow
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh workflow run deploy.yml --repo ${{ github.repository }} -f run_number=${{ github.run_number }}
