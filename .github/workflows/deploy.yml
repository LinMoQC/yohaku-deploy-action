name: Deploy

on:
  workflow_dispatch:
  workflow_call:

permissions: write-all

env:
  STANDALONE_SUBPATH: standalone/apps/web

jobs:
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get Release Download URLs
        id: release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          ZIP_URL=$(gh release view deploy-latest --repo ${{ github.repository }} --json assets -q '.assets[] | select(.name=="release.zip") | .url')
          PM2_URL=$(gh release view deploy-latest --repo ${{ github.repository }} --json assets -q '.assets[] | select(.name=="ecosystem.config.js") | .url')
          echo "zip_url=$ZIP_URL" >> "$GITHUB_OUTPUT"
          echo "pm2_url=$PM2_URL" >> "$GITHUB_OUTPUT"

      - name: Download assets
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          curl -fsSL -H "Authorization: token $GH_TOKEN" -H "Accept: application/octet-stream" \
            "${{ steps.release.outputs.zip_url }}" -o release.zip
          curl -fsSL -H "Authorization: token $GH_TOKEN" -H "Accept: application/octet-stream" \
            "${{ steps.release.outputs.pm2_url }}" -o ecosystem.config.js
          echo "release.zip: $(ls -lh release.zip | awk '{print $5}')"

      - name: Transfer via SSH pipe
        run: |
          sudo apt-get install -y sshpass
          sshpass -p '${{ secrets.PASSWORD }}' ssh -o StrictHostKeyChecking=no \
            -c chacha20-poly1305@openssh.com -o Compression=yes \
            ${{ secrets.USER }}@${{ secrets.HOST }} -p ${{ secrets.PORT }} \
            "mkdir -p /tmp/yohaku && cat > /tmp/yohaku/release.zip" < release.zip
          sshpass -p '${{ secrets.PASSWORD }}' ssh -o StrictHostKeyChecking=no \
            -c chacha20-poly1305@openssh.com -o Compression=yes \
            ${{ secrets.USER }}@${{ secrets.HOST }} -p ${{ secrets.PORT }} \
            "cat > /tmp/yohaku/ecosystem.config.js" < ecosystem.config.js

      - name: Deploy
        uses: appleboy/ssh-action@master
        with:
          command_timeout: 10m
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          script: |
            set -e
            source $HOME/.bashrc
            basedir=$HOME/yohaku
            workdir=$basedir/$(date +%s)
            mkdir -p $workdir $basedir/.cache

            cd $workdir
            mv /tmp/yohaku/release.zip .
            unzip -qq -o release.zip
            install -m 644 /tmp/yohaku/ecosystem.config.js $basedir/ecosystem.config.js
            rm -r /tmp/yohaku

            # Install dependencies (node_modules excluded from zip)
            echo "Installing dependencies..."
            cd $workdir/${{ env.STANDALONE_SUBPATH }}
            npm install --production --prefer-offline 2>&1 | tail -3 || npm install --production 2>&1 | tail -3

            rm -f .env
            ln -s $basedir/.env .env
            export NEXT_SHARP_PATH=$(npm root -g)/sharp
            ln -sf $workdir/${{ env.STANDALONE_SUBPATH }}/server.js $basedir/server.js
            mkdir -p .next
            rm -rf .next/cache
            ln -sf $basedir/.cache .next/cache

            cd $basedir
            if pm2 describe Yohaku >/dev/null 2>&1; then
              pm2 reload Yohaku --update-env
            else
              pm2 start $basedir/ecosystem.config.js --update-env
            fi
            rm -f $workdir/release.zip
            pm2 save
            echo "Deployed successfully"
