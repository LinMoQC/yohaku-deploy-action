name: Deploy

on:
  workflow_dispatch:
    inputs:
      run_number:
        description: 'Deploy run number'
        required: false
        default: ''
  workflow_call:
    inputs:
      run_number:
        type: string
        required: false
        default: ''

permissions: write-all

env:
  STANDALONE_SUBPATH: standalone/apps/web

jobs:
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get Release Download URLs
        id: release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          ZIP_URL=$(gh release view deploy-latest --repo ${{ github.repository }} --json assets -q '.assets[] | select(.name=="release.zip") | .url')
          PM2_URL=$(gh release view deploy-latest --repo ${{ github.repository }} --json assets -q '.assets[] | select(.name=="ecosystem.config.js") | .url')
          echo "zip_url=$ZIP_URL" >> "$GITHUB_OUTPUT"
          echo "pm2_url=$PM2_URL" >> "$GITHUB_OUTPUT"

      - name: Deploy
        uses: appleboy/ssh-action@master
        with:
          command_timeout: 10m
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          script: |
            # Fix DNS for GitHub API access
            grep -q '140.82.121.3 api.github.com' /etc/hosts || echo '140.82.121.3 api.github.com' >> /etc/hosts

            set -e
            source $HOME/.bashrc
            basedir=$HOME/yohaku
            workdir=$basedir/${{ inputs.run_number || github.run_number }}
            mkdir -p $workdir $basedir/.cache

            GH_PAT=$(grep GH_TOKEN $HOME/yohaku/.env | cut -d= -f2)

            echo "Downloading release.zip..."
            curl -fsSL --http1.1 --retry 3 --retry-delay 5 -H "Authorization: token $GH_PAT" -H "Accept: application/octet-stream" \
              "${{ steps.release.outputs.zip_url }}" -o $workdir/release.zip

            echo "Downloading ecosystem.config.js..."
            curl -fsSL --http1.1 -H "Authorization: token $GH_PAT" -H "Accept: application/octet-stream" \
              "${{ steps.release.outputs.pm2_url }}" -o $basedir/ecosystem.config.js

            cd $workdir
            unzip -qq -o release.zip
            rm -rf $workdir/${{ env.STANDALONE_SUBPATH }}/.env
            ln -s $HOME/yohaku/.env $workdir/${{ env.STANDALONE_SUBPATH }}/.env
            export NEXT_SHARP_PATH=$(npm root -g)/sharp
            ln -sf $workdir/${{ env.STANDALONE_SUBPATH }}/server.js $basedir/server.js
            mkdir -p $workdir/${{ env.STANDALONE_SUBPATH }}/.next
            rm -rf $workdir/${{ env.STANDALONE_SUBPATH }}/.next/cache
            ln -sf $basedir/.cache $workdir/${{ env.STANDALONE_SUBPATH }}/.next/cache
            cd $basedir
            if pm2 describe Yohaku >/dev/null 2>&1; then
              pm2 reload ecosystem.config.js --update-env
            else
              pm2 start ecosystem.config.js --update-env
            fi
            rm $workdir/release.zip
            pm2 save
            echo "Deployed successfully"
