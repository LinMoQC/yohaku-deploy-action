name: Build and Deploy

on:
  push:
    branches:
      - main
  repository_dispatch:
    types: [trigger-workflow]

permissions: write-all
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HASH_FILE: build_hash
  SOURCE_REPO: innei-dev/Yohaku
  BUILD_COMMAND: pnpm --filter @yohaku/web build:ci
  STANDALONE_SUBPATH: standalone/apps/web

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    if: ${{ github.event.head_commit.message != 'Update hash file' }}
    outputs:
      hash_content: ${{ steps.read_hash.outputs.hash_content }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Read HASH_FILE content
        id: read_hash
        run: |
          content=$(cat ${{ env.HASH_FILE }}) || true
          echo "hash_content=$content" >> "$GITHUB_OUTPUT"

  check:
    name: Check Should Rebuild
    runs-on: ubuntu-latest
    needs: prepare
    outputs:
      canceled: ${{ steps.use_content.outputs.canceled }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: innei-dev/Yohaku
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0
          lfs: true
          submodules: recursive
      - name: Compare hash
        id: use_content
        env:
          FILE_HASH: ${{ needs.prepare.outputs.hash_content }}
        run: |
          file_hash=$FILE_HASH
          current_hash=$(git rev-parse --short HEAD)
          if [ "$file_hash" == "$current_hash" ]; then
            echo "canceled=true" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build artifact
    runs-on: ubuntu-latest
    needs: check
    if: ${{needs.check.outputs.canceled != 'true'}}
    strategy:
      matrix:
        node-version: [lts/*]
    outputs:
      sha_short: ${{ steps.store.outputs.sha_short }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0
          lfs: true
          submodules: recursive
      - name: Checkout LFS objects
        run: git lfs checkout
      - uses: pnpm/action-setup@v2
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - uses: jongwooo/next-cache@v1
      - name: Install dependencies
        run: pnpm install
      - name: Build project
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_GATEWAY_URL: ${{ secrets.NEXT_PUBLIC_GATEWAY_URL }}
        run: |
          ${{ env.BUILD_COMMAND }}
          cd apps/web/.next
          rm -rf cache
          cp -r ../public ./standalone/public
          mv ./static ./standalone/apps/web/.next/static
          cd ./standalone
          echo ';process.title = "Yohaku (NextJS)"' >> server.js
          cd "$GITHUB_WORKSPACE"
          mkdir -p assets
          rm -f assets/release.zip
          (cd apps/web/.next && zip --symlinks -r "$GITHUB_WORKSPACE/assets/release.zip" ./* -x "dev/*" -x "cache/*")
      - name: Cache Build Artifacts
        uses: actions/cache/save@v4
        with:
          path: assets
          key: ${{ github.run_number }}-release
      - name: Store artifact commit version
        id: store
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy artifact
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Restore cached Build Artifacts
        uses: actions/cache/restore@v4
        with:
          path: assets
          key: ${{ github.run_number }}-release
      - name: Move assets to root
        run: mv assets/release.zip release.zip

      - name: Transfer via GitHub Release + download
        run: |
          # Create GitHub Release with artifacts
          gh release create deploy-${{ github.run_number }} release.zip ecosystem.config.js \
            --repo ${{ github.repository }} \
            --title "Deploy ${{ github.run_number }}" \
            --notes "Auto deploy from workflow"

          # Get asset download URLs
          ZIP_URL=$(gh release view deploy-${{ github.run_number }} --repo ${{ github.repository }} --json assets -q '.assets[] | select(.name=="release.zip") | .url')
          PM2_URL=$(gh release view deploy-${{ github.run_number }} --repo ${{ github.repository }} --json assets -q '.assets[] | select(.name=="ecosystem.config.js") | .url')
          echo "zip_url=$ZIP_URL" >> "$GITHUB_OUTPUT"
          echo "pm2_url=$PM2_URL" >> "$GITHUB_OUTPUT"
        id: release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Download + Deploy on server
        uses: appleboy/ssh-action@master
        with:
          command_timeout: 10m
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          script: |
            # Fix DNS for GitHub access (bypass SNI filtering)
            if ! grep -q '140.82.121.3 api.github.com' /etc/hosts; then
              echo '140.82.121.3 api.github.com' >> /etc/hosts
            fi

            set -e
            source $HOME/.bashrc
            basedir=$HOME/yohaku
            workdir=$basedir/${{ github.run_number }}
            mkdir -p $workdir $basedir/.cache

            GH_PAT=$(grep GH_TOKEN $HOME/yohaku/.env | cut -d= -f2)
            echo "Downloading release.zip..."
            curl -fsSL -H "Authorization: token $GH_PAT" -H "Accept: application/octet-stream" \
              "${{ steps.release.outputs.zip_url }}" -o $workdir/release.zip
            echo "Downloading ecosystem.config.js..."
            curl -fsSL -H "Authorization: token $GH_PAT" -H "Accept: application/octet-stream" \
              "${{ steps.release.outputs.pm2_url }}" -o $basedir/ecosystem.config.js

            cd $workdir
            unzip -qq -o release.zip
            rm -rf $workdir/${{ env.STANDALONE_SUBPATH }}/.env
            ln -s $HOME/yohaku/.env $workdir/${{ env.STANDALONE_SUBPATH }}/.env
            export NEXT_SHARP_PATH=$(npm root -g)/sharp
            ln -sf $workdir/${{ env.STANDALONE_SUBPATH }}/server.js $basedir/server.js
            mkdir -p $workdir/${{ env.STANDALONE_SUBPATH }}/.next
            rm -rf $workdir/${{ env.STANDALONE_SUBPATH }}/.next/cache
            ln -sf $basedir/.cache $workdir/${{ env.STANDALONE_SUBPATH }}/.next/cache
            cd $basedir
            if pm2 describe Yohaku >/dev/null 2>&1; then
              pm2 reload ecosystem.config.js --update-env
            else
              pm2 start ecosystem.config.js --update-env
            fi
            rm $workdir/release.zip
            pm2 save
            echo "Deployed successfully"

  store:
    name: Store hash
    runs-on: ubuntu-latest
    needs: [deploy, build]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Write hash
        env:
          SHA_SHORT: ${{ needs.build.outputs.sha_short }}
        run: echo $SHA_SHORT > ${{ env.HASH_FILE }}
      - name: Commit and push
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add ${{ env.HASH_FILE }}
          git commit -a -m "Update hash file"
      - uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
