name: Deploy

on:
  workflow_dispatch:
    inputs:
      run_number:
        description: 'Deploy run number'
        required: false
        default: ''
  workflow_call:
    inputs:
      run_number:
        type: string
        required: false
        default: ''

permissions: write-all

env:
  STANDALONE_SUBPATH: standalone/apps/web
  OLD_HOST: 14.103.194.70

jobs:
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get Release Download URLs
        id: release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          ZIP_URL=$(gh release view deploy-latest --repo ${{ github.repository }} --json assets -q '.assets[] | select(.name=="release.zip") | .url')
          PM2_URL=$(gh release view deploy-latest --repo ${{ github.repository }} --json assets -q '.assets[] | select(.name=="ecosystem.config.js") | .url')
          echo "zip_url=$ZIP_URL" >> "$GITHUB_OUTPUT"
          echo "pm2_url=$PM2_URL" >> "$GITHUB_OUTPUT"

      - name: Download on Old Server & SCP to New Server
        uses: appleboy/ssh-action@master
        with:
          command_timeout: 10m
          host: ${{ env.OLD_HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.PASSWORD }}
          port: 22
          script: |
            set -e

            # Ensure SSH key has correct permissions
            chmod 600 /tmp/migration_key/id_ed25519 2>/dev/null || true

            # Download from GitHub Release (old server can access GitHub)
            echo "Downloading release.zip..."
            curl -fsSL --http1.1 --retry 3 --retry-delay 5 \
              -H "Authorization: token ${{ secrets.GH_PAT }}" \
              -H "Accept: application/octet-stream" \
              "${{ steps.release.outputs.zip_url }}" -o /tmp/release.zip

            echo "Downloading ecosystem.config.js..."
            curl -fsSL --http1.1 \
              -H "Authorization: token ${{ secrets.GH_PAT }}" \
              -H "Accept: application/octet-stream" \
              "${{ steps.release.outputs.pm2_url }}" -o /tmp/ecosystem.config.js

            # SCP files to new server (which can't access GitHub directly)
            echo "Transferring files to new server (${{ secrets.HOST }})..."
            scp -i /tmp/migration_key/id_ed25519 \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              /tmp/release.zip ${{ secrets.USER }}@${{ secrets.HOST }}:/tmp/release.zip

            scp -i /tmp/migration_key/id_ed25519 \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              /tmp/ecosystem.config.js ${{ secrets.USER }}@${{ secrets.HOST }}:/tmp/ecosystem.config.js

            # Cleanup old server temp files
            rm -f /tmp/release.zip /tmp/ecosystem.config.js
            echo "Files transferred successfully"

      - name: Deploy on New Server
        uses: appleboy/ssh-action@master
        with:
          command_timeout: 10m
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          script: |
            set -e
            source $HOME/.bashrc
            basedir=$HOME/yohaku
            workdir=$basedir/$(date +%s)
            mkdir -p $workdir $basedir/.cache

            echo "Extracting release.zip..."
            cd $workdir
            unzip -qq -o /tmp/release.zip
            rm -f /tmp/release.zip

            # Deploy ecosystem.config.js
            cp /tmp/ecosystem.config.js $basedir/ecosystem.config.js
            rm -f /tmp/ecosystem.config.js

            # Symlink .env
            rm -rf $workdir/${{ env.STANDALONE_SUBPATH }}/.env
            ln -s $HOME/yohaku/.env $workdir/${{ env.STANDALONE_SUBPATH }}/.env

            # Setup sharp
            export NEXT_SHARP_PATH=$(npm root -g)/sharp

            # Symlink server.js for PM2
            ln -sf $workdir/${{ env.STANDALONE_SUBPATH }}/server.js $basedir/server.js

            # Setup Next.js cache symlink
            mkdir -p $workdir/${{ env.STANDALONE_SUBPATH }}/.next
            rm -rf $workdir/${{ env.STANDALONE_SUBPATH }}/.next/cache
            ln -sf $basedir/.cache $workdir/${{ env.STANDALONE_SUBPATH }}/.next/cache

            cd $basedir
            if pm2 describe Yohaku >/dev/null 2>&1; then
              pm2 reload Yohaku --update-env
            else
              pm2 start ecosystem.config.js --update-env
            fi
            pm2 save
            echo "Deployed successfully"
